# clippy configuration for Open Knowledge Catalog
# Run with: cargo clippy -- -D warnings -A dead_code -W unused_imports -W unused_variables -W unused_mut -D clippy::panic -D clippy::todo -D clippy::unimplemented -D clippy::dbg_macro -D clippy::wildcard_imports

# Lints to allow
[allow]
# Allow dead_code for utility functions that may be used in future
dead_code = true

# Lints to warn on
[warn]
unused_imports = true
unused_variables = true
unused_mut = true

# Lints to deny (treat as errors)
[deny]
panic = true
todo = true
unimplemented = true
dbg_macro = true
wildcard_imports = true

# Clippy-specific lints
clippy::all = "warn"
clippy::pedantic = "warn"
clippy::nursery = "warn"
clippy::cargo = "warn"

# Specific clippy lints to deny
clippy::panic = "deny"
clippy::todo = "deny"
clippy::unimplemented = "deny"
clippy::print_stdout = "warn"
clippy::print_stderr = "warn"
clippy::dbg_macro = "deny"
clippy::wildcard_imports = "deny"
clippy::missing_docs_in_private_items = "allow"
clippy::missing_errors_doc = "warn"
clippy::missing_panics_doc = "warn"
clippy::must_use_candidate = "warn"
clippy::similar_names = "warn"
clippy::too_many_lines = "warn"
clippy::cognitive_complexity = "warn"
clippy::large_enum_variant = "warn"
clippy::enum_glob_use = "warn"
clippy::unused_self = "warn"
clippy::needless_pass_by_value = "warn"
clippy::needless_clone = "warn"
clippy::redundant_clone = "warn"
clippy::clone_on_copy = "warn"
clippy::trivially_copy_pass_by_ref = "warn"
clippy::ptr_arg = "warn"
clippy::ref_option_ref = "warn"
clippy::option_option = "warn"
clippy::result_unit_err = "warn"
clippy::unnecessary_wraps = "warn"
clippy::let_underscore_must_use = "warn"
clippy::let_underscore_untyped = "warn"
clippy::match_same_arms = "warn"
clippy::match_wildcard_for_single_variants = "warn"
clippy::if_not_else = "warn"
clippy::if_then_some_else_none = "warn"
clippy::manual_map = "warn"
clippy::manual_filter = "warn"
clippy::manual_find = "warn"
clippy::manual_flatten = "warn"
clippy::manual_try_fold = "warn"
clippy::manual_ok_or = "warn"
clippy::filter_map_next = "warn"
clippy::filter_map = "warn"
clippy::map_flatten = "warn"
clippy::flat_map_option = "warn"
clippy::option_map_unwrap_or = "warn"
clippy::option_map_unwrap_or_else = "warn"
clippy::result_map_unwrap_or_else = "warn"
clippy::result_map_or_else = "warn"
clippy::option_expect_none = "warn"
clippy::result_expect_err = "warn"
# Allow unwrap_used and expect_used for mutex locks (common pattern)
clippy::option_unwrap_used = "allow"
clippy::result_unwrap_used = "allow"
clippy::expect_used = "allow"
clippy::unwrap_used = "allow"