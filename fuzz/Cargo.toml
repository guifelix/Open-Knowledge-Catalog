[package]
name = "okc-fuzz"
version = "0.1.0"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
okc = { path = "..", package = "okc" }
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"

[profile.release]
debug = 1

[[bin]]
name = "frontmatter_extraction"
path = "fuzz_targets/frontmatter_extraction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_parsing"
path = "fuzz_targets/yaml_parsing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_normalization"
path = "fuzz_targets/path_normalization.rs"
test = false
doc = false
bench = false

[[bin]]
name = "query_metadata"
path = "fuzz_targets/query_metadata.rs"
test = false
doc = false
bench = false
