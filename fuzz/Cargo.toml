[package]
name = "okf-fuzz"
version = "0.1.0"
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
open-knowledge-catalog = { path = ".." }
libfuzzer-sys = "0.4"

[profile.release]
debug = 1

[[bin]]
name = "frontmatter_extraction"
path = "fuzz_targets/frontmatter_extraction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yaml_parsing"
path = "fuzz_targets/yaml_parsing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "path_normalization"
path = "fuzz_targets/path_normalization.rs"
test = false
doc = false
bench = false
